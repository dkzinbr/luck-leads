<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 168" fill="none">
  <defs>
    <linearGradient id="brassX" x1="8" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a5210"/>
      <stop offset=".22" stop-color="#c9a227"/>
      <stop offset=".42" stop-color="#f8e7a0"/>
      <stop offset=".55" stop-color="#ffe9a8"/>
      <stop offset=".72" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#5c450c"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".28" stop-color="#f3d56a"/>
      <stop offset=".62" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#6e5410"/>
    </radialGradient>
    <linearGradient id="glassShade" x1="16" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".48"/>
      <stop offset=".22" stop-color="#000" stop-opacity=".08"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".78" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </linearGradient>
    <pattern id="helix" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(-56 26 84)">
      <rect width="22" height="22" fill="#f4f1ea"/>
      <rect y="0" width="22" height="6.2" fill="#c8102e"/>
      <rect y="11" width="22" height="6.2" fill="#1e3a8a"/>
    </pattern>
    <clipPath id="cyl">
      <rect x="16.5" y="28" width="19" height="104" rx="3.2"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-8%" width="140%" height="116%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- foot -->
    <ellipse cx="26" cy="157.5" rx="13.5" ry="4.2" fill="url(#brassX)"/>
    <rect x="15" y="148" width="22" height="10" rx="2.2" fill="url(#brassX)"/>
    <ellipse cx="26" cy="148.4" rx="11" ry="2.6" fill="#f3d56a" opacity=".35"/>

    <!-- lower collar -->
    <rect x="14.5" y="130" width="23" height="9" rx="1.8" fill="url(#brassX)"/>
    <rect x="15.5" y="132" width="21" height="2" fill="#fff4c8" opacity=".35"/>

    <!-- cylinder -->
    <rect x="16.5" y="28" width="19" height="104" rx="3.2" fill="#eeeae2"/>
    <g clip-path="url(#cyl)">
      <rect x="16.5" y="28" width="19" height="104" fill="url(#helix)"/>
      <rect x="16.5" y="28" width="19" height="104" fill="url(#glassShade)"/>
      <rect x="19.2" y="32" width="3.2" height="94" rx="1.6" fill="#fff" opacity=".28"/>
    </g>
    <rect x="16.5" y="28" width="19" height="104" rx="3.2" stroke="#c9a227" stroke-width=".7" fill="none"/>

    <!-- upper collar -->
    <rect x="14.5" y="24.5" width="23" height="8.5" rx="1.8" fill="url(#brassX)"/>
    <rect x="15.5" y="26.2" width="21" height="2" fill="#fff4c8" opacity=".4"/>

    <!-- neck -->
    <rect x="21.5" y="18.5" width="9" height="7" rx="1" fill="url(#brassX)"/>

    <!-- finial -->
    <circle cx="26" cy="13.2" r="10.4" fill="url(#ball)"/>
    <ellipse cx="22.4" cy="9.6" rx="3.4" ry="2.2" fill="#fff" opacity=".45"/>
    <circle cx="26" cy="3.4" r="2.1" fill="url(#ball)"/>
  </g>
</svg>
